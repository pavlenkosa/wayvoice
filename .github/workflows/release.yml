name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to publish, e.g. 0.5.0'
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}-${{ inputs.version || github.ref_name }}
  cancel-in-progress: false

jobs:
  release:
    name: Build & publish GitHub Release
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install validation tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            shellcheck desktop-file-utils libxml2-utils

      - name: Resolve and verify release version
        id: version
        shell: bash
        env:
          MANUAL_VERSION: ${{ inputs.version }}
        run: |
          if [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" ]]; then
            VERSION="${MANUAL_VERSION#v}"
          else
            VERSION="${GITHUB_REF_NAME#v}"
          fi

          test -n "$VERSION"
          PROJECT_VERSION="$(python scripts/check-version.py "$VERSION")"
          test "$PROJECT_VERSION" = "$VERSION"

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"

      - name: Python syntax
        run: python -m compileall -q app/src tests scripts/check-version.py

      - name: Unit tests
        env:
          PYTHONPATH: app/src
        run: python -m unittest discover -s tests -v

      - name: Shellcheck
        run: |
          shellcheck \
            scripts/wayvoice \
            scripts/wayvoice-daemon \
            scripts/wayvoice-settings \
            scripts/setup-user \
            scripts/build-deb.sh \
            packaging/DEBIAN/postinst \
            packaging/DEBIAN/postrm \
            packaging/DEBIAN/prerm

      - name: Validate desktop metadata
        run: |
          desktop-file-validate data/io.github.stepan.WayVoice.desktop
          xmllint --noout data/io.github.stepan.WayVoice.metainfo.xml

      - name: Build Debian package
        run: ./scripts/build-deb.sh

      - name: Verify Debian package
        shell: bash
        run: |
          DEB="$(find dist -maxdepth 1 -name '*.deb' -print -quit)"
          test -n "$DEB"
          PACKAGE_VERSION="$(dpkg-deb -f "$DEB" Version)"
          test "$PACKAGE_VERSION" = "${{ steps.version.outputs.version }}"
          dpkg-deb --info "$DEB"
          dpkg-deb --contents "$DEB" > /dev/null

      - name: Create source archive and checksums
        shell: bash
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          git archive \
            --format=zip \
            --prefix="wayvoice-${VERSION}/" \
            --output="dist/wayvoice-${VERSION}-source.zip" \
            HEAD

          (
            cd dist
            sha256sum *.deb wayvoice-${VERSION}-source.zip > SHA256SUMS
          )

      - name: Create tag for manual release
        if: github.event_name == 'workflow_dispatch'
        shell: bash
        run: |
          TAG="${{ steps.version.outputs.tag }}"
          if git rev-parse "$TAG" >/dev/null 2>&1; then
            test "$(git rev-list -n 1 "$TAG")" = "$GITHUB_SHA"
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git tag -a "$TAG" -m "WayVoice ${{ steps.version.outputs.version }}"
            git push origin "$TAG"
          fi

      - name: Upload release artifact
        uses: actions/upload-artifact@v7
        with:
          name: wayvoice-${{ steps.version.outputs.version }}-release
          path: |
            dist/*.deb
            dist/*.deb.sha256
            dist/*-source.zip
            dist/SHA256SUMS
          if-no-files-found: error
          retention-days: 30

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: WayVoice ${{ steps.version.outputs.version }}
          generate_release_notes: true
          prerelease: ${{ contains(steps.version.outputs.version, '-') }}
          files: |
            dist/*.deb
            dist/*.deb.sha256
            dist/*-source.zip
            dist/SHA256SUMS
          fail_on_unmatched_files: true
