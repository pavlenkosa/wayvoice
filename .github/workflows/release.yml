name: Release

on:
  push:
    # A tag publishes that tag. A push to main publishes when - and only when -
    # the version in the tree changed, so "bump the version, commit, push" is the
    # whole procedure and there is no second ref to remember.
    tags:
      - 'v*'
    branches:
      - 'main'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to publish, e.g. 0.5.0'
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}-${{ inputs.version || github.ref_name }}
  cancel-in-progress: false

jobs:
  release:
    name: Build & publish GitHub Release
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Decide what to release
        id: version
        shell: bash
        env:
          MANUAL_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail

          # The version is read out of the tree rather than out of the ref, so a
          # push to main and a push of the tag cannot disagree about what is
          # being released.
          version_at() {
            git show "$1:app/src/wayvoice/__init__.py" |
              sed -n 's/^__version__ = "\(.*\)"$/\1/p'
          }

          FROM_TAG=false
          if [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" ]]; then
            VERSION="${MANUAL_VERSION#v}"
          elif [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
            FROM_TAG=true
          else
            VERSION="$(version_at HEAD)"
          fi

          if [ -z "$VERSION" ]; then
            echo "No version to release: run this from a tag, or fill in the version input." >&2
            exit 1
          fi
          PROJECT_VERSION="$(python scripts/check-version.py "$VERSION")"
          if [ "$PROJECT_VERSION" != "$VERSION" ]; then
            echo "The tree says $PROJECT_VERSION, the ref says $VERSION." >&2
            exit 1
          fi
          TAG="v$VERSION"

          # "Is there anything to release?" comes before any check about where a
          # tag points, and it needs two questions, not one. The order matters:
          # main keeps receiving commits after a release, and the tag of the
          # version just published points at the commit before them, so asking
          # about that first would turn every later commit into a failed run -
          # how a workflow that should be quiet most of the time ends up
          # permanently red.
          git fetch --force --tags
          RELEASED=false
          git rev-parse --verify --quiet "refs/tags/$TAG" >/dev/null && RELEASED=true

          if ! $FROM_TAG && [[ "${GITHUB_EVENT_NAME}" != "workflow_dispatch" ]]; then
            PREVIOUS="$(version_at HEAD^ 2>/dev/null || true)"
            if [ "$PREVIOUS" = "$VERSION" ] && $RELEASED; then
              echo "Version is still $VERSION and $TAG exists: nothing to release."
              echo "release=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            # Both cases below are a release that has not happened yet: the
            # version moved, or it moved earlier and the tag never made it to
            # the remote. Publishing is idempotent - a version whose tag exists is
            # not published twice - so recovering from a forgotten tag is the
            # same code path as an ordinary bump.
            if [ "$PREVIOUS" = "$VERSION" ]; then
              echo "$TAG does not exist although the tree is at $VERSION: publishing it now."
            else
              echo "Version ${PREVIOUS:-none} -> $VERSION"
            fi
          fi

          # From here on something is being released, so the tag has to agree.
          TAG_SHA=""
          if git rev-parse --verify --quiet "refs/tags/$TAG" >/dev/null; then
            TAG_SHA="$(git rev-list -n 1 "$TAG")"
            if [ "$TAG_SHA" != "$GITHUB_SHA" ]; then
              echo "Tag $TAG points at ${TAG_SHA:0:7}, this run is at ${GITHUB_SHA:0:7}." >&2
              echo "A version already released from another commit is not this" >&2
              echo "commit's to publish. Move the tag, or cut a new version." >&2
              exit 1
            fi
          elif $FROM_TAG; then
            echo "Running from $TAG, but that tag is not in the checkout." >&2
            exit 1
          fi

          # An explicit output rather than an expression at the place of use: a
          # boolean interpolated into YAML arrives as the string "false", and how
          # the publishing action reads that is not something to leave to chance.
          # 0.6.0 was published as a prerelease although its version has no dash.
          if [[ "$VERSION" == *-* ]]; then
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          else
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          fi
          {
            echo "release=true"
            echo "version=$VERSION"
            echo "tag=$TAG"
            echo "tag_sha=$TAG_SHA"
          } >> "$GITHUB_OUTPUT"

          echo "Releasing $VERSION as $TAG from ${GITHUB_SHA:0:7}"


      - name: Install validation tools
        if: steps.version.outputs.release == 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            shellcheck desktop-file-utils libxml2-utils

      - name: Python syntax
        if: steps.version.outputs.release == 'true'
        run: python -m compileall -q app/src tests scripts/check-version.py

      - name: Unit tests
        if: steps.version.outputs.release == 'true'
        env:
          PYTHONPATH: app/src
        run: python -m unittest discover -s tests -t . -v

      - name: Shellcheck
        if: steps.version.outputs.release == 'true'
        run: |
          shellcheck \
            scripts/wayvoice \
            scripts/wayvoice-daemon \
            scripts/wayvoice-settings \
            scripts/wayvoice-engine-setup \
            scripts/wayvoice-ydotoold \
            scripts/setup-user \
            scripts/build-deb.sh \
            scripts/build-rpm.sh \
            scripts/build-ydotool.sh \
            packaging/DEBIAN/postinst \
            packaging/DEBIAN/postrm \
            packaging/DEBIAN/prerm

      - name: Validate desktop metadata
        if: steps.version.outputs.release == 'true'
        run: |
          desktop-file-validate data/io.github.stepan.WayVoice.desktop
          xmllint --noout data/io.github.stepan.WayVoice.metainfo.xml
          xmllint --noout packaging/io.github.stepan.WayVoice.manage-deps.policy

      - name: Build Debian package
        if: steps.version.outputs.release == 'true'
        run: ./scripts/build-deb.sh

      - name: Build and inspect Fedora RPM
        if: steps.version.outputs.release == 'true'
        run: |
          docker run --rm -v "$PWD:/src" -w /src fedora:44 sh -ec '
            dnf install -y rpm-build gcc python3 systemd-rpm-macros tar gzip
            ./scripts/build-rpm.sh
            rpm -qip dist/*.rpm
            rpm -qlp dist/*.rpm
            rpm -qp --scripts dist/*.rpm
          '

      - name: Verify Debian package
        if: steps.version.outputs.release == 'true'
        shell: bash
        run: |
          DEB="$(find dist -maxdepth 1 -name '*.deb' -print -quit)"
          test -n "$DEB"
          PACKAGE_VERSION="$(dpkg-deb -f "$DEB" Version)"
          test "$PACKAGE_VERSION" = "${{ steps.version.outputs.version }}"
          # Bundled native binaries mean the package must advertise the build
          # host's architecture rather than 'all'.
          PACKAGE_ARCH="$(dpkg-deb -f "$DEB" Architecture)"
          test "$PACKAGE_ARCH" = "$(dpkg --print-architecture)"
          dpkg-deb --info "$DEB"
          dpkg-deb --contents "$DEB" > /dev/null

      - name: Create source archive and checksums
        if: steps.version.outputs.release == 'true'
        shell: bash
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          git archive \
            --format=zip \
            --prefix="wayvoice-${VERSION}/" \
            --output="dist/wayvoice-${VERSION}-source.zip" \
            HEAD

          (
            cd dist
            sha256sum *.deb *.rpm wayvoice-${VERSION}-source.zip > SHA256SUMS
          )

      - name: Upload release artifact
        if: steps.version.outputs.release == 'true'
        uses: actions/upload-artifact@v6
        with:
          name: wayvoice-${{ steps.version.outputs.version }}-release
          path: |
            dist/*.deb
            dist/*.deb.sha256
            dist/*.rpm
            dist/*.rpm.sha256
            dist/*-source.zip
            dist/SHA256SUMS
          if-no-files-found: error
          retention-days: 30

      - name: Publish GitHub Release
        if: steps.version.outputs.release == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          # The tag does not exist yet when the release came from a push to main,
          # and this action creates it. commitish says which commit it must
          # point at, rather than leaving it to the default branch's head.
          commitish: ${{ github.sha }}
          name: WayVoice ${{ steps.version.outputs.version }}
          generate_release_notes: true
          prerelease: ${{ steps.version.outputs.prerelease }}
          files: |
            dist/*.deb
            dist/*.deb.sha256
            dist/*.rpm
            dist/*.rpm.sha256
            dist/*-source.zip
            dist/SHA256SUMS
          fail_on_unmatched_files: true
