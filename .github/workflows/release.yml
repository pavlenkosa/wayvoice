name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Validate & build release
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      sha: ${{ steps.version.outputs.tag_sha }}
      version: ${{ steps.version.outputs.version }}
      prerelease: ${{ steps.version.outputs.prerelease }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Validate tag and release notes
        id: version
        run: python3 scripts/check-release.py

      - name: Install validation tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            shellcheck desktop-file-utils libxml2-utils \
            python3-gi gir1.2-gtk-4.0 gir1.2-adw-1 xvfb xauth dbus-x11

      - name: Static analysis and public documentation
        run: |
          python -m pip install --requirement requirements-dev.txt
          python -m ruff check app/src tests scripts
          python scripts/check-public-docs.py

      - name: Python syntax
        run: python -m compileall -q app/src tests scripts/check-version.py

      - name: Unit tests
        env:
          PYTHONPATH: app/src
        run: python -m unittest discover -s tests -t . -v

      - name: GTK UI tests
        env:
          PYTHONPATH: app/src
          GDK_BACKEND: x11
        run: |
          xvfb-run -a dbus-run-session -- /usr/bin/python3 -c 'import gi; gi.require_version("Gtk", "4.0"); gi.require_version("Adw", "1"); from gi.repository import Gtk, Adw; assert Gtk.init_check(); Adw.init()'
          xvfb-run -a dbus-run-session -- /usr/bin/python3 -m unittest discover -s tests -t . -p 'test_ui*.py' -v

      - name: Shellcheck
        run: |
          shellcheck \
            scripts/wayvoice \
            scripts/wayvoice-daemon \
            scripts/wayvoice-settings \
            scripts/wayvoice-engine-setup \
            scripts/wayvoice-ydotoold \
            scripts/setup-user \
            scripts/build-deb.sh \
            scripts/build-rpm.sh \
            scripts/build-rpm-container.sh \
            scripts/build-ydotool.sh \
            packaging/DEBIAN/postinst \
            packaging/DEBIAN/postrm \
            packaging/DEBIAN/prerm

      - name: Validate desktop metadata
        run: |
          desktop-file-validate data/io.github.stepan.WayVoice.desktop
          xmllint --noout data/io.github.stepan.WayVoice.metainfo.xml

      - name: Build Debian package
        run: ./scripts/build-deb.sh

      - name: Build and inspect Fedora RPM
        run: |
          ./scripts/build-rpm-container.sh

      - name: Verify Debian package
        shell: bash
        run: |
          DEB="$(find dist -maxdepth 1 -name '*.deb' -print -quit)"
          test -n "$DEB"
          PACKAGE_VERSION="$(dpkg-deb -f "$DEB" Version)"
          test "$PACKAGE_VERSION" = "${{ steps.version.outputs.version }}"
          # Bundled native binaries mean the package must advertise the build
          # host's architecture rather than 'all'.
          PACKAGE_ARCH="$(dpkg-deb -f "$DEB" Architecture)"
          test "$PACKAGE_ARCH" = "$(dpkg --print-architecture)"
          dpkg-deb --info "$DEB"
          dpkg-deb --contents "$DEB" > /dev/null

      - name: Build and inspect AppImage
        run: python3 scripts/build-appimage.py

      - name: Create source archive and checksums
        shell: bash
        run: |
          cp "${{ steps.version.outputs.notes }}" dist/RELEASE_NOTES.md
          VERSION="${{ steps.version.outputs.version }}"
          git archive \
            --format=zip \
            --prefix="wayvoice-${VERSION}/" \
            --output="dist/wayvoice-${VERSION}-source.zip" \
            HEAD

          (
            cd dist
            sha256sum *.deb *.rpm wayvoice-${VERSION}-x86_64.AppImage wayvoice-${VERSION}-source.zip > SHA256SUMS
          )

      - name: Upload release artifact
        uses: actions/upload-artifact@v4
        with:
          name: wayvoice-${{ steps.version.outputs.version }}-release
          path: |
            dist/*.deb
            dist/*.deb.sha256
            dist/*.rpm
            dist/*.rpm.sha256
            dist/wayvoice-${{ steps.version.outputs.version }}-x86_64.AppImage
            dist/wayvoice-${{ steps.version.outputs.version }}-x86_64.AppImage.sha256
            dist/*-source.zip
            dist/SHA256SUMS
            dist/RELEASE_NOTES.md
          if-no-files-found: error
          retention-days: 30

  publish:
    name: Approve & publish release
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: release
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.build.outputs.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: wayvoice-${{ needs.build.outputs.version }}-release
          path: dist
      - name: Publish only the validated existing tag
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.build.outputs.tag }}
          EXPECTED_SHA: ${{ needs.build.outputs.sha }}
          PRERELEASE: ${{ needs.build.outputs.prerelease }}
          APPROVAL_CONFIGURED: ${{ vars.RELEASE_ENVIRONMENT_READY }}
        run: |
          set -euo pipefail
          test "$APPROVAL_CONFIGURED" = true || { echo "Configure the release environment reviewers and RELEASE_ENVIRONMENT_READY first." >&2; exit 1; }
          REMOTE_SHA="$(git ls-remote origin "refs/tags/$TAG" "refs/tags/$TAG^{}" | awk '/\^\{\}$/ {peeled=$1} {raw=$1} END {print peeled ? peeled : raw}')"
          test "$REMOTE_SHA" = "$EXPECTED_SHA"
          test "$(git rev-parse "refs/tags/$TAG^{commit}")" = "$EXPECTED_SHA"
          cd dist
          sha256sum --check SHA256SUMS
          flags=(--latest=false)
          if [ "$PRERELEASE" = true ]; then
            flags+=(--prerelease)
          else
            flags=(--latest)
          fi
          # Creation fails if this release already exists; never overwrite assets.
          # Draft first supports immutable releases: attach everything before publishing.
          gh release create "$TAG" --verify-tag --draft "${flags[@]}" \
            --title "WayVoice ${TAG#v}" --notes-file RELEASE_NOTES.md \
            *.deb *.deb.sha256 *.rpm *.rpm.sha256 *.AppImage *.AppImage.sha256 \
            *-source.zip SHA256SUMS
          gh release edit "$TAG" --draft=false "${flags[@]}"
