name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Test
        env:
          PYTHONPATH: app/src
        run: python -m unittest discover -s tests -v
      - name: Build
        run: ./scripts/build-deb.sh
      - name: Source archive
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          git archive --format=zip --output="dist/wayvoice-${VERSION}-source.zip" HEAD
          sha256sum "dist/wayvoice-${VERSION}-source.zip" >> "dist/SHA256SUMS"
          sha256sum dist/*.deb >> "dist/SHA256SUMS"
      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            dist/*.deb
            dist/*.sha256
            dist/*-source.zip
            dist/SHA256SUMS
