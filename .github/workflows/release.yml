name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to publish, e.g. 0.5.0'
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}-${{ inputs.version || github.ref_name }}
  cancel-in-progress: false

jobs:
  release:
    name: Build & publish GitHub Release
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install validation tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            shellcheck desktop-file-utils libxml2-utils

      - name: Resolve and verify the release
        id: version
        shell: bash
        env:
          MANUAL_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail

          if [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" ]]; then
            VERSION="${MANUAL_VERSION#v}"
          else
            VERSION="${GITHUB_REF_NAME#v}"
          fi
          if [ -z "$VERSION" ]; then
            echo "No version given: run this from the tag, or fill in the version input." >&2
            exit 1
          fi

          PROJECT_VERSION="$(python scripts/check-version.py "$VERSION")"
          test "$PROJECT_VERSION" = "$VERSION"
          TAG="v$VERSION"

          # The tag has to exist already and point at this commit.
          #
          # It used to be created here, and that quietly disabled the automatic
          # path: the workflow pushes with GITHUB_TOKEN, and GitHub never starts
          # workflow runs from a push made with GITHUB_TOKEN. So the tag would
          # appear on the remote with nothing having run, and the human's own
          # "git push origin v0.6.0" afterwards would answer "Everything
          # up-to-date" and start nothing either - which is exactly what it looks
          # like from the outside: the release that never happens on its own.
          git fetch --force --tags
          if ! git rev-parse --verify --quiet "refs/tags/$TAG" >/dev/null; then
            echo "Tag $TAG does not exist yet. Publish it with:" >&2
            echo "    git tag -a $TAG -m 'WayVoice $VERSION' && git push origin $TAG" >&2
            exit 1
          fi
          TAG_SHA="$(git rev-list -n 1 "$TAG")"
          if [ "$TAG_SHA" != "$GITHUB_SHA" ]; then
            echo "Tag $TAG points at ${TAG_SHA:0:7}, this run is at ${GITHUB_SHA:0:7}." >&2
            echo "Move the tag to the commit you mean to release, or run the workflow from that tag." >&2
            exit 1
          fi

          # An explicit output rather than an expression at the place of use. A
          # boolean interpolated into YAML arrives as the string "false", and how
          # the publishing action reads that is not something to leave to
          # chance: 0.6.0 was published as a prerelease although its version
          # carries no dash.
          if [[ "$VERSION" == *-* ]]; then
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          else
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          fi

          {
            echo "version=$VERSION"
            echo "tag=$TAG"
            echo "tag_sha=$TAG_SHA"
          } >> "$GITHUB_OUTPUT"

          echo "Releasing $VERSION from $TAG at ${GITHUB_SHA:0:7}"

      - name: Python syntax
        run: python -m compileall -q app/src tests scripts/check-version.py

      - name: Unit tests
        env:
          PYTHONPATH: app/src
        run: python -m unittest discover -s tests -v

      - name: Shellcheck
        run: |
          shellcheck \
            scripts/wayvoice \
            scripts/wayvoice-daemon \
            scripts/wayvoice-settings \
            scripts/setup-user \
            scripts/build-deb.sh \
            packaging/DEBIAN/postinst \
            packaging/DEBIAN/postrm \
            packaging/DEBIAN/prerm

      - name: Validate desktop metadata
        run: |
          desktop-file-validate data/io.github.stepan.WayVoice.desktop
          xmllint --noout data/io.github.stepan.WayVoice.metainfo.xml
          xmllint --noout packaging/io.github.stepan.WayVoice.manage-deps.policy

      - name: Build Debian package
        run: ./scripts/build-deb.sh

      - name: Verify Debian package
        shell: bash
        run: |
          DEB="$(find dist -maxdepth 1 -name '*.deb' -print -quit)"
          test -n "$DEB"
          PACKAGE_VERSION="$(dpkg-deb -f "$DEB" Version)"
          test "$PACKAGE_VERSION" = "${{ steps.version.outputs.version }}"
          dpkg-deb --info "$DEB"
          dpkg-deb --contents "$DEB" > /dev/null

      - name: Create source archive and checksums
        shell: bash
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          git archive \
            --format=zip \
            --prefix="wayvoice-${VERSION}/" \
            --output="dist/wayvoice-${VERSION}-source.zip" \
            HEAD

          (
            cd dist
            sha256sum *.deb wayvoice-${VERSION}-source.zip > SHA256SUMS
          )

      - name: Upload release artifact
        uses: actions/upload-artifact@v4
        with:
          name: wayvoice-${{ steps.version.outputs.version }}-release
          path: |
            dist/*.deb
            dist/*.deb.sha256
            dist/*-source.zip
            dist/SHA256SUMS
          if-no-files-found: error
          retention-days: 30

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: WayVoice ${{ steps.version.outputs.version }}
          generate_release_notes: true
          prerelease: ${{ steps.version.outputs.prerelease }}
          files: |
            dist/*.deb
            dist/*.deb.sha256
            dist/*-source.zip
            dist/SHA256SUMS
          fail_on_unmatched_files: true
