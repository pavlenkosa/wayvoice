name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install validation tools
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck desktop-file-utils libxml2-utils
      - name: Python syntax
        run: python -m compileall -q app/src tests
      - name: Unit tests
        env:
          PYTHONPATH: app/src
        run: python -m unittest discover -s tests -v
      - name: Shellcheck
        run: shellcheck scripts/wayvoice scripts/wayvoice-daemon scripts/wayvoice-settings scripts/setup-user scripts/build-deb.sh packaging/DEBIAN/postinst packaging/DEBIAN/postrm packaging/DEBIAN/prerm
      - name: Desktop metadata
        run: |
          desktop-file-validate data/io.github.stepan.WayVoice.desktop
          xmllint --noout data/io.github.stepan.WayVoice.metainfo.xml
      - name: Build Debian package
        run: ./scripts/build-deb.sh
      - name: Inspect Debian package
        run: |
          dpkg-deb --info dist/*.deb
          dpkg-deb --contents dist/*.deb > /dev/null
      - uses: actions/upload-artifact@v4
        with:
          name: wayvoice-deb
          path: |
            dist/*.deb
            dist/*.sha256
          if-no-files-found: error
