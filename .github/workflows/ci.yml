name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-and-build:
    name: Test & build native packages
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install validation tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            shellcheck desktop-file-utils libxml2-utils

      - name: Check version consistency
        run: python scripts/check-version.py

      - name: Python syntax
        run: python -m compileall -q app/src tests scripts/check-version.py

      - name: Unit tests
        env:
          PYTHONPATH: app/src
        run: python -m unittest discover -s tests -t . -v

      - name: Shellcheck
        run: |
          shellcheck \
            scripts/wayvoice \
            scripts/wayvoice-daemon \
            scripts/wayvoice-settings \
            scripts/wayvoice-engine-setup \
            scripts/wayvoice-ydotoold \
            scripts/setup-user \
            scripts/build-deb.sh \
            scripts/build-rpm.sh \
            scripts/build-ydotool.sh \
            packaging/DEBIAN/postinst \
            packaging/DEBIAN/postrm \
            packaging/DEBIAN/prerm

      - name: Validate desktop metadata
        run: |
          desktop-file-validate data/io.github.stepan.WayVoice.desktop
          xmllint --noout data/io.github.stepan.WayVoice.metainfo.xml
          xmllint --noout packaging/io.github.stepan.WayVoice.manage-deps.policy

      - name: Build Debian package
        run: ./scripts/build-deb.sh

      - name: Build and inspect Fedora RPM
        run: |
          docker run --rm -v "$PWD:/src" -w /src fedora:44 sh -ec '
            dnf install -y rpm-build gcc python3 systemd-rpm-macros tar gzip
            ./scripts/build-rpm.sh
            rpm -qip dist/*.rpm
            rpm -qlp dist/*.rpm
            rpm -qp --scripts dist/*.rpm
          '

      - name: Inspect Debian package
        run: |
          dpkg-deb --info dist/*.deb
          dpkg-deb --contents dist/*.deb > /dev/null
          PACKAGE_VERSION="$(dpkg-deb -f dist/*.deb Version)"
          PROJECT_VERSION="$(python scripts/check-version.py)"
          test "$PACKAGE_VERSION" = "$PROJECT_VERSION"
          # The package bundles natively compiled binaries, so it advertises the
          # build host's architecture rather than 'all'.
          PACKAGE_ARCH="$(dpkg-deb -f dist/*.deb Architecture)"
          test "$PACKAGE_ARCH" = "$(dpkg --print-architecture)"

      - name: Upload native packages
        uses: actions/upload-artifact@v4
        with:
          name: wayvoice-native-${{ github.sha }}
          path: |
            dist/*.deb
            dist/*.deb.sha256
            dist/*.rpm
            dist/*.rpm.sha256
          if-no-files-found: error
          retention-days: 14

  flatpak-manifest:
    name: Flatpak manifest assertions
    runs-on: ubuntu-24.04
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # The Flatpak build itself stays a manual, networked validation (see
      # docs/PROJECT_TASKS.md P1.2); this job pins the manifest's structure so a
      # regression that loses the wayvoice module, the wl-clipboard pin, the
      # launch command or a permission the app cannot work without fails CI
      # instead of shipping unnoticed. The same script backs the local release
      # gate, so local truth and CI truth are one file.
      - name: Check manifest structure
        run: python3 scripts/check-flatpak-manifest.py
