name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-and-build:
    name: Test & build native packages
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install validation tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            shellcheck desktop-file-utils libxml2-utils

      - name: Check version consistency
        run: python scripts/check-version.py

      - name: Python syntax
        run: python -m compileall -q app/src tests scripts/check-version.py

      - name: Unit tests
        env:
          PYTHONPATH: app/src
        run: python -m unittest discover -s tests -t . -v

      - name: Shellcheck
        run: |
          shellcheck \
            scripts/wayvoice \
            scripts/wayvoice-daemon \
            scripts/wayvoice-settings \
            scripts/wayvoice-engine-setup \
            scripts/wayvoice-ydotoold \
            scripts/setup-user \
            scripts/build-deb.sh \
            scripts/build-rpm.sh \
            scripts/build-rpm-container.sh \
            scripts/build-ydotool.sh \
            packaging/DEBIAN/postinst \
            packaging/DEBIAN/postrm \
            packaging/DEBIAN/prerm

      - name: Validate desktop metadata
        run: |
          desktop-file-validate data/io.github.stepan.WayVoice.desktop
          xmllint --noout data/io.github.stepan.WayVoice.metainfo.xml
          xmllint --noout packaging/io.github.stepan.WayVoice.manage-deps.policy

      - name: Build Debian package
        run: ./scripts/build-deb.sh

      - name: Build and inspect Fedora RPM
        run: |
          ./scripts/build-rpm-container.sh

      - name: Inspect Debian package
        run: |
          dpkg-deb --info dist/*.deb
          dpkg-deb --contents dist/*.deb > /dev/null
          PACKAGE_VERSION="$(dpkg-deb -f dist/*.deb Version)"
          PROJECT_VERSION="$(python scripts/check-version.py)"
          test "$PACKAGE_VERSION" = "$PROJECT_VERSION"
          # The package bundles natively compiled binaries, so it advertises the
          # build host's architecture rather than 'all'.
          PACKAGE_ARCH="$(dpkg-deb -f dist/*.deb Architecture)"
          test "$PACKAGE_ARCH" = "$(dpkg --print-architecture)"

      - name: Upload native packages
        uses: actions/upload-artifact@v4
        with:
          name: wayvoice-native-${{ github.sha }}
          path: |
            dist/*.deb
            dist/*.deb.sha256
            dist/*.rpm
            dist/*.rpm.sha256
          if-no-files-found: error
          retention-days: 14

  flatpak-manifest:
    name: Flatpak manifest assertions
    runs-on: ubuntu-24.04
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Bundle builds run in the tag-only Release workflow.
      # This fast check also backs the local release gate.
      - name: Check manifest structure
        run: python3 scripts/check-flatpak-manifest.py

  gtk-tests:
    name: GTK UI tests
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Install GTK test environment
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends python3-gi gir1.2-gtk-4.0 gir1.2-adw-1 xvfb xauth dbus-x11
      - name: Run UI tests with a real GTK display
        env:
          PYTHONPATH: app/src
          GDK_BACKEND: x11
        run: |
          xvfb-run -a dbus-run-session -- /usr/bin/python3 -c 'import gi; gi.require_version("Gtk", "4.0"); gi.require_version("Adw", "1"); from gi.repository import Gtk, Adw; assert Gtk.init_check(); Adw.init()'
          xvfb-run -a dbus-run-session -- /usr/bin/python3 -m unittest discover -s tests -t . -p 'test_ui*.py' -v

  quality:
    name: Static analysis & coverage
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install pinned development tools
        run: python -m pip install --requirement requirements-dev.txt
      - name: Check Python correctness
        run: python -m ruff check app/src tests scripts
      - name: Check public documentation
        run: python scripts/check-public-docs.py
      - name: Measure critical-module branch coverage
        env:
          PYTHONPATH: app/src
        run: |
          python -m coverage run -m unittest discover -s tests -t . -q
          python -m coverage report
          python -m coverage xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: critical-coverage-${{ github.sha }}
          path: coverage.xml
          if-no-files-found: error
          retention-days: 14
