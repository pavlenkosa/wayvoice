[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "wayvoice"
version = "0.8.4"
description = "Local voice input for Linux"
requires-python = ">=3.11"
license = "AGPL-3.0-or-later"
authors = [{name = "WayVoice contributors"}]
keywords = ["wayland", "gnome", "speech-to-text", "whisper", "dictation", "gtk4"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
  "Topic :: Multimedia :: Sound/Audio :: Speech",
]

[project.scripts]
wayvoice = "wayvoice.cli:main"
wayvoice-daemon = "wayvoice.daemon:main"
wayvoice-settings = "wayvoice.ui:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
wayvoice = ["runtime-requirements.txt", "locales/*.json"]
