[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "wayvoice"
version = "0.5.0"
description = "Local speech-to-text dictation for GNOME and Wayland"
readme = "../README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "WayVoice contributors"}]
keywords = ["wayland", "gnome", "speech-to-text", "whisper", "dictation", "gtk4"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: X11 Applications :: GTK",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Multimedia :: Sound/Audio :: Speech",
]

[project.scripts]
wayvoice = "wayvoice.cli:main"
wayvoice-daemon = "wayvoice.daemon:main"
wayvoice-settings = "wayvoice.ui:main"

[tool.setuptools.packages.find]
where = ["src"]
